 مكاتب ECZA في برج تمكين بالرياض، المؤثثة بقطع مستوردة من إيطاليا، إضافة إلى مكاتب الموسى ونسما للبنية التحتية والتقنية."}],layout:"split-list",blocksTitle:{en:"How an office project runs",ar:"كيف يسير مشروع المكتب"},blocks:[{title:{en:"Consultation and design",ar:"الاستشارة والتصميم"},text:{en:"We learn how your teams work, then develop layouts, furniture options and a design direction.",ar:"نتعرّف على طريقة عمل فرقك، ثم نطوّر المخططات وخيارات الأثاث واتجاه التصميم."}},{title:{en:"Planning and approvals",ar:"التخطيط والموافقات"},text:{en:"Drawings, specifications and timelines are finalised and the required approvals obtained.",ar:"تُعتمد الرسومات والمواصفات والجداول الزمنية ونستكمل الموافقات المطلوبة."}},{title:{en:"Fit-out execution",ar:"تنفيذ التجهيز"},text:{en:"Partitioning, lighting and finishes are built, then furniture is delivered and installed.",ar:"تُنفَّذ القواطع والإضاءة والتشطيبات، ثم يُسلَّم الأثاث ويُركَّب."}},{title:{en:"Handover and aftercare",ar:"التسليم وما بعده"},text:{en:"A walk-through with your team, snag resolution and support after you move in.",ar:"جولة مع فريقك ومعالجة الملاحظات ودعم بعد الانتقال."}}],includes:{title:{en:"Scope we cover",ar:"نطاق العمل"},items:[{en:"Space planning",ar:"تخطيط المساحات"},{en:"Partitioning",ar:"القواطع"},{en:"Lighting",ar:"الإضاءة"},{en:"Interior design",ar:"التصميم الداخلي"},{en:"Workstations and executive furniture",ar:"محطات العمل والأثاث التنفيذي"},{en:"Meeting and boardroom furniture",ar:"أثاث الاجتماعات ومجالس الإدارة"}]},hero:{...V("office"),art:"office",tone:"stone",alt:{en:"Boardroom with a long table, chairs and pendant lights",ar:"قاعة اجتماعات بطاولة طويلة وكراسٍ وإضاءة معلّقة"}},detail:{...V("officeChair"),art:"plan",tone:"ivory",alt:{en:"Office floor plan with workstations and meeting rooms",ar:"مسقط مكتب بمحطات عمل وغرف اجتماعات"}},related:["end-to-end-project-management-services","project-furniture-design-supply","turnkey-project-solutions"],projects:["ecza","almousa-offices","nesma-infrastru  property.",ar:"مقاعد وطاولات لافتة ترسم الانطباع الأول عن المنشأة."}},{title:{en:"Restaurants and cafés",ar:"المطاعم والمقاهي"},text:{en:"Dining chairs, banquettes and tables sized for covers, cleaning and service routes.",ar:"كراسي وأرائك وطاولات طعام بمقاسات تراعي عدد المقاعد والتنظيف ومسارات الخدمة."}},{title:{en:"Serviced apartments",ar:"الشقق المخدومة"},text:{en:"Residential comfort with the durability and consistency an operator needs.",ar:"راحة المنزل مع المتانة والتجانس اللذين يحتاجهما المشغّل."}}],faqs:[{q:{en:"How long do hospitality orders take?",ar:"كم تستغرق طلبات الضيافة؟"},a:{en:"It depends on project size and how much is customised. Most orders take 8–12 weeks from approval to arrival.",ar:"يعتمد ذلك على حجم المشروع ومدى التخصيص. تستغرق معظم الطلبات من 8 إلى 12 أسبوعًا من الاعتماد حتى الوصول."}},{q:{en:"Do you handle large hotel projects?",ar:"هل تتولّون مشاريع فندقية كبيرة؟"},a:{en:"Yes. We regularly furnish hotels and resorts at scale and manage each step, from planning through installation.",ar:"نعم. نؤثّث الفنادق والمنتجعات على نطاق واسع بانتظام، وندير كل مرحلة من التخطيط حتى التركيب."}},{q:{en:"Can furniture be tailored to our brand?",ar:"هل يمكن تخصيص الأثاث وفق هويتنا؟"},a:{en:"Yes. We work with your design team to develop pieces that match your brand and concept.",ar:"نعم. نعمل مع فريق التصميم لديك لتطوير قطع تتوافق مع هويتك وفكرتك."}},{q:{en:"Is installation included?",ar:"هل يشمل العمل التركيب؟"},a:{en:"We provide professional installation on all projects.",ar:"نوفّر التركيب الاحترافي في جميع المشاريع."}}],hero:{...V("hotelRoom"),art:"hotel",tone:"charcoal",alt:{en:"Hotel suite with an upholstered bed and wall lights",ar:"جناح فندقي بسرير منجّد وإضاءة جدارية"}},detail:{...V("restaurant"),art:"dining",tone:"ivory",alt:{en:"Restaurant dining table with chairs under a pendant light",ar:"طاولة طعام في مطعم مع كراسٍ تحت إضاءة معلّقة"}},related:["project-furniture-design-supply","turnkey-project-solutions","end-to-end-project-management-services
