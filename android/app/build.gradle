plugins {
    id 'com.android.application'
}

android {
    namespace 'com.papercalc.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.papercalc.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The signing key never lives in the repo: CI passes it in through environment variables.
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The web app in /paper-calculator is the single source for the screens and formulas.
    sourceSets {
        main {
            assets.srcDirs = ['../../paper-calculator']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
