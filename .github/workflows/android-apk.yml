name: Android APK

on:
  push:
    paths:
      - 'paper-calculator/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Uses a fixed key from repository secrets when present, so later versions install as updates.
      # Without those secrets a one-off key is generated and thrown away after the build.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret set; signing with a one-off key."
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=papercalc
            keytool -genkeypair -noprompt -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Paper Calculator"
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Check signature and permissions
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "--- permissions requested ---"
          "$BT/aapt" dump permissions "$APK"
          cp "$APK" PaperCalculator.apk
          sha256sum PaperCalculator.apk | tee PaperCalculator.apk.sha256
          rm -f "$KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: PaperCalculator-apk
          path: |
            PaperCalculator.apk
            PaperCalculator.apk.sha256

  test-android-13:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PaperCalculator-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and open on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./android/ci/smoke-test.sh PaperCalculator.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-13-smoke-test
          path: smoke/

  release:
    needs: test-android-13
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PaperCalculator-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "paper-calculator-v1.0-build${{ github.run_number }}" \
            PaperCalculator.apk PaperCalculator.apk.sha256 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Paper Calculator 1.0 (build ${{ github.run_number }})" \
            --notes "Android APK for Paper Calculator. Tested on an Android 13 emulator. SHA-256: $(cut -d' ' -f1 PaperCalculator.apk.sha256)"
